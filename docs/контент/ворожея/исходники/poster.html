<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Unicase:wght@600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Spectral:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* статичные материалы: ?k=dossier1|dossier2|dossier3|prophecy&i=N|story. Пост 1080×1350, сторис 1080×1920 */
  :root { --aura: 201,168,255; --gold: #d6a35c; --bone: #f3e2d6; }
  html, body { margin: 0; background: #06040a; }
  .p { position: relative; width: 1080px; height: 1350px; overflow: hidden; color: var(--bone); font-family: 'Cormorant Garamond', serif;
    background: radial-gradient(ellipse at 50% 35%, #24163a 0%, #0c0812 60%, #06040a 100%); }
  .p.story { height: 1920px; }
  .bg { position: absolute; inset: 0; background-size: cover; background-position: 50% 20%; }
  .fade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(6,4,10,0) 40%, rgba(6,4,10,.92) 72%, #06040a 100%); }
  .kick { font: 500 26px/1 Spectral, serif; letter-spacing: .4em; text-transform: uppercase; color: var(--gold); }
  .name { font: 600 150px/1 'Cormorant Unicase', serif; letter-spacing: .05em; color: #e6d6ff; text-shadow: 0 0 40px rgba(var(--aura),.85); }
  .epi { font: italic 500 56px/1.1 'Cormorant Garamond', serif; }
  .url { font: 500 28px/1 Spectral, serif; letter-spacing: .36em; text-shadow: 0 0 16px rgba(255,45,149,.6); }
  .bottom { position: absolute; left: 0; right: 0; bottom: 90px; text-align: center; }
  .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 110px; }
  .quote { font: italic 500 58px/1.3 'Cormorant Garamond', serif; color: #f3e9ff; text-shadow: 0 0 26px rgba(var(--aura),.6); }
  .body { font: 500 44px/1.45 'Cormorant Garamond', serif; color: var(--bone); opacity: .9; }
  .rule { width: 120px; height: 1px; background: var(--gold); opacity: .6; margin: 46px auto; }
  .cards { display: flex; gap: 34px; justify-content: center; margin: 56px 0; }
  .cards img { width: 220px; height: 418px; border-radius: 10px; box-shadow: 0 20px 40px -12px #000; }
  .cards img:nth-child(1) { rotate: -8deg; translate: 0 24px; } .cards img:nth-child(3) { rotate: 8deg; translate: 0 24px; }
  .front { width: 360px; height: 560px; margin: 50px auto 56px; border-radius: 18px; position: relative; color: #3a2312;
    background: radial-gradient(ellipse at 50% 40%, #eedcb8, #cdb083 70%, #9c7b50); box-shadow: inset 0 0 40px rgba(70,35,10,.5), 0 0 70px rgba(var(--aura),.5); }
  .front::before { content: ''; position: absolute; inset: 16px; border: 2px solid rgba(70,35,10,.5); border-radius: 12px; }
  .front svg { position: absolute; left: 50%; top: 150px; translate: -50% 0; width: 170px; }
  .front b { position: absolute; left: 0; right: 0; bottom: 120px; font: 600 56px/1 'Cormorant Unicase', serif; letter-spacing: .06em; }
  .slide { position: absolute; top: 60px; right: 70px; font: 500 24px Spectral; letter-spacing: .3em; color: var(--gold); opacity: .8; }
</style></head>
<body><div id="root"></div>
<script>
const q = new URLSearchParams(location.search), k = q.get('k');
const P = [
  ['Око', 'Вижу дорогу в три поворота. На втором — не оглядывайся.'],
  ['Пламя', 'Сегодня искра, завтра костёр. Береги ладони.'],
  ['Луна', 'Луна откроет тебе дверь. Закрывать её будешь сам.'],
];
const eye = '<svg viewBox="0 0 64 40"><ellipse cx="32" cy="20" rx="29" ry="16" fill="none" stroke="rgba(58,35,18,.75)" stroke-width="3"/><circle cx="32" cy="20" r="7" fill="rgba(58,35,18,.75)"/></svg>';
const url = '<div class="url">OSKOLKIHAOSA.RU</div>';
const T = {
  dossier1: `<div class="p"><div class="bg" style="background-image:url(vorozheya-art.jpg)"></div><div class="fade"></div><div class="slide">1 / 3</div>
    <div class="bottom"><div class="kick">Досье · действующие лица</div><div class="name" style="margin:26px 0 18px">Ворожея</div><div class="epi">Та, что видит</div>
    <div class="kick" style="margin-top:34px;color:var(--bone);opacity:.7">Провидица · Тени</div></div></div>`,
  dossier2: `<div class="p"><div class="bg" style="background-image:url(vorozheya-art.jpg);filter:blur(14px) brightness(.25)"></div><div class="slide">2 / 3</div>
    <div class="center"><div class="kick">Кто она</div><div class="rule"></div>
    <div class="body">Айла приходит к ней накануне битвы — узнать, чем всё кончится.<br>Чего хочет сама Ворожея, не знает никто.</div>
    <div class="rule"></div><div class="quote">«Она сидит у чаши с тёмной водой,<br>сжимая веретено из кости людской»</div>
    <div class="kick" style="margin-top:40px;opacity:.75">из песни «Ворожея»</div></div></div>`,
  dossier3: `<div class="p"><div class="slide">3 / 3</div><div class="center"><div class="kick">Гадание</div>
    <div class="name" style="font-size:110px;margin-top:30px">Вытяни карту</div>
    <div class="cards"><img src="card-back-0.webp"><img src="card-back-2.webp"><img src="card-back-4.webp"></div>
    <div class="epi" style="font-size:48px">Ворожея раскладывает трижды в день.<br>Три карты — одно пророчество.</div><div style="margin-top:56px">${url}</div></div></div>`,
  prophecy: () => { const [card, text] = P[+q.get('i') || 0]; return `<div class="p"><div class="center"><div class="kick">Пророчество дня</div>
    <div class="front">${eye}<b>${card}</b></div>
    <div class="quote">«${text}»</div><div class="kick" style="margin-top:56px;letter-spacing:.3em;color:var(--bone);opacity:.75">Вытяни свою карту</div><div style="margin-top:22px">${url}</div></div></div>`; },
  story: `<div class="p story"><div class="bg" style="background-image:url(vorozheya.jpg);background-position:50% 30%;opacity:.85"></div><div class="fade"></div>
    <div class="bottom" style="bottom:300px"><div class="kick">Осколки хаоса · новый трек</div><div class="name" style="font-size:200px;margin:34px 0 10px">Завтра</div>
    <div class="epi" style="font-size:72px;color:#e6d6ff">«Ворожея» · 18 ноября</div><div class="kick" style="margin-top:40px;color:var(--bone);opacity:.75">VK Музыка · Яндекс Музыка</div></div></div>`,
};
const v = T[k]; document.getElementById('root').innerHTML = typeof v === 'function' ? v() : v;
</script></body></html>
