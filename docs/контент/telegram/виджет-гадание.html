</style><h1>Ворожея тянет карту</h1><div class=c id=c><div class=i><div class='s b'><div class=e></div><p style='color:#d6a35c'>нажми на карту</p></div><div class='s a'><b id=t></b><i id=x></i></div></div></div>
<p id=n>три карты на сегодня</p><button id=m hidden>Ещё карту</button><script>
const P=[["Горящая корона","Корона упадёт раньше, чем остынет кровь. Не стой под ней."],["Горящая корона","То, что ты хочешь надеть, жжёт. Готовь не голову — сердце."],["Рыжая лиса","Тебе улыбнутся в чаще. Не иди за хвостом — иди за ветром."],["Рыжая лиса","Друг, которого ты однажды спас, придёт, когда перестанешь звать."],["Молот","Кто куёт в темноте, знает все выходы. Спроси у огня дорогу."],["Молот","Ещё один удар — и железо примет форму. Не бросай на последнем."],["Кубок","На донышке горчит. Не допивай чужое вино."],["Кубок","Сегодня тебя угостят щедро. Посчитай, чем заплатишь."],["Капкан","То, что держит тебя, держит и того, кто поставил. Он рядом."],["Капкан","Не рвись. Железо отпускает только тех, кто замирает."],["Пепел","Из пепла не строят дом. Но из пепла выходят — живыми."],["Пепел","Сгоревшее освободило место. Не засыпай его новым страхом."],["Луна","Луна откроет тебе дверь. Закрывать её будешь сам."],["Луна","Ночью всё честнее. Скажи вслух то, о чём молчишь днём."],["Изба","Изба повернётся к тебе лицом, если ты не врёшь себе."],["Изба","Кто идёт след в след, однажды придёт туда, где не был."],["Клинок","Сталь твоя верна. Сердце — нет. Реши, что точить."],["Клинок","Удар, которого ты ждёшь, придёт не спереди."],["Тень","Твоя тень знает дорогу лучше тебя. Отпусти её на шаг вперёд."],["Тень","Хмель уйдёт к утру. Тень останется. Подружись с ней."],["Сладкий яд","Самое сладкое — самое острое. Улыбайся, но держи нож."],["Сладкий яд","Детский смех ещё живёт в тебе. Не дай ему стать криком."],["Трон","Ты ищешь трон. Трон ищет тебя. Кто найдёт первым?"],["Трон","Пустое место ждёт долго. Но не вечно."],["Ворон","Весть уже в пути. Не беги навстречу — она сама найдёт."],["Ворон","Тот, кто молчит рядом, видит больше, чем говорит."],["Нить","Твоя нить сплетена с чужой. Порвёшь одну — дрогнут обе."],["Нить","На тебе три узла. Один развяжется сегодня."],["Свеча","Малого огня хватит, чтобы увидеть дверь. Не жди пожара."],["Свеча","Догорает то, что ты давно отпустил. Не держи воск."],["Ключ","Ответ лежит у тебя под ногами. Опусти глаза."],["Ключ","Не каждая запертая дверь — твоя. Не ломай чужих замков."],["Око","Вижу дорогу в три поворота. На втором — не оглядывайся."],["Око","Кто долго смотрит в огонь, начинает видеть в нём себя."],["Кровь","Брат за брата не встал. Встанет дочь за отца."],["Кровь","Пролитое не высохнет, пока не будет отдано."],["Дорога","Три дороги — и на каждой твоя тень. Выбери, где она короче."],["Дорога","Таверна у развилки скажет больше, чем карта. Слушай пьяных."],["Колыбель","Тот, кого считали мёртвым, ещё дышит. Прислушайся."],["Колыбель","Начало ближе, чем кажется. Не путай его с концом."],["Пламя","Огонь, что ты несёшь, согреет не тебя. Неси всё равно."],["Пламя","Сегодня искра, завтра костёр. Береги ладони."]];let k=0,u=[];const c=document.getElementById('c'),m=document.getElementById('m'),n=document.getElementById('n');
function d(){let r;do r=Math.floor(Math.random()*P.length);while(u.includes(r));u.push(r);document.getElementById('t').textContent=P[r][0];document.getElementById('x').textContent='«'+P[r][1]+'»';c.classList.add('f');k++;
n.textContent=k<3?'карта '+k+' из 3':'Три карты вытянуты. Остальное споёт Ворожея — «Ворожея» в VK Музыке и Яндекс Музыке';m.hidden=k>=3}
c.onclick=()=>{if(!c.classList.contains('f')&&k<3)d()};m.onclick=()=>{c.classList.remove('f');m.hidden=true;setTimeout(d,500)};
</script>
