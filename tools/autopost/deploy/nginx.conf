# Глашатай: glashatai.oskolkihaosa.ru → 127.0.0.1:3400. https выдаст certbot --nginx -d glashatai.oskolkihaosa.ru.
server {
  listen 80;
  server_name glashatai.oskolkihaosa.ru;
  # сжатие ответов кабинета: путь до сервера из-за границы медленный, JSON очереди сжимается в ~8 раз
  gzip on; gzip_proxied any; gzip_vary on; gzip_comp_level 5; gzip_min_length 1024;
  gzip_types application/json application/javascript text/javascript text/css image/svg+xml;
  # ролики загружаются через кабинет
  client_max_body_size 400m;

  # Публичные файлы для Instagram: Meta забирает ролик по ссылке. Имена — хэши, списка папки нет.
  location /m/ {
    alias /var/www/glashatai-media/;
    autoindex off;
    expires 7d;
  }

  # подтверждение адреса для TikTok (Content Posting API, pull_by_url); файл лежит рядом с публичными роликами
  location = /tiktokQ9vny2wGINBBpPCxma6R6hwrQvhG6cRg.txt { alias /var/www/glashatai-media/tiktokQ9vny2wGINBBpPCxma6R6hwrQvhG6cRg.txt; default_type text/plain; }

  location / {
    proxy_pass http://127.0.0.1:3400;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_request_buffering off;
  }
}
